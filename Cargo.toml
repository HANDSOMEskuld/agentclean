[package]
name = "agentclean"
version = "0.1.0"
edition = "2021"
description = "Conservative, quarantine-first disk analysis and cleanup for agent workspaces"
license = "MIT"
readme = "README.md"
repository = "https://github.com/HANDSOMEskuld/agentclean"
homepage = "https://github.com/HANDSOMEskuld/agentclean"
keywords = ["cleanup", "disk", "quarantine", "security", "agents"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.87"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "agentclean"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
